name: Build APK

# Jalankan saat push ke branch utama, saat membuat tag versi (v*),
# atau manual lewat tombol "Run workflow" di tab Actions.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # diperlukan agar bisa membuat Release saat ada tag

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK (Buildozer)
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          workdir: android
          buildozer_version: stable

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: metadatacleaner-debug-apk
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error

      - name: Lampirkan APK ke Release (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.buildozer.outputs.filename }}
