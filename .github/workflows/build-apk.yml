name: Build APK

# Jalankan saat push ke branch utama, saat membuat tag versi (v*),
# atau manual lewat tombol "Run workflow" di tab Actions.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # diperlukan agar bisa membuat Release saat ada tag

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang prasyarat sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Pasang Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36

      - name: Cache Buildozer (SDK/NDK & build)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK debug
        working-directory: android
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
          buildozer -v android debug

      - name: Temukan path APK
        id: find_apk
        run: |
          APK=$(find android/bin -name "*.apk" | head -n 1)
          echo "Menemukan APK: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: metadatacleaner-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Lampirkan APK ke Release (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
